<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Local Experience Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>

        input[type="text"], input[type="email"], textarea {
            border: 2px solid #764ba2;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            margin-bottom: 15px;
        }
        input[type="submit"] {
            background-color: #764ba2;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="submit"]:hover { background-color: #667eea; }
        .map-box { height: 300px; background: #eee; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6">
                <h2>Inquiry Form</h2>
                <form action="#">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your name" required>
                    
                    <label>Email Address</label>
                    <input type="email" placeholder="email@example.com" required>
                    
                    <label>How can we help?</label>
                    <textarea rows="5"></textarea>
                    
                    <input type="submit" value="Send Inquiry">
                </form>
            </div>
            <div class="col-md-6">
                <h2>Our Location</h2>
                <div class="map-box">
                    <p class="text-muted text-center p-3"> Location. </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
