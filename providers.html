<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Providers | Local Experience Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
    <style>
        .gallery-img { 
            width: 100%; height: 250px; object-fit: cover; border-radius: 10px;
            transition: 0.5s; cursor: pointer; opacity: 0.9;
        }
        .gallery-img:hover { transform: scale(1.05); opacity: 1; }
    </style>
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-5">Meet Our Local Experts</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <a href="Master Carpenter.jpg" data-lightbox="providers" data-title="Sean Sinco - Master Carpenter">
                    <img src="Master Carpenter.jpg" class="gallery-img shadow" alt="Sean Sinco">
                </a>
                <h5 class="mt-2">Sean Sinco</h5>
                <p class="text-muted">Master Carpenter</p>
            </div>
            <div class="col-md-4">
                <a href="Academic Scholar.png" data-lightbox="providers" data-title="Yam Bautista - Academic Scholar">
                    <img src="Academic Scholar.png" class="gallery-img shadow" alt="Yam Bautista">
                </a>
                <h5 class="mt-2">Yam Bautista</h5>
                <p class="text-muted">Academic Scholar</p>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox-plus-jquery.min.js"></script>
</body>
</html>
